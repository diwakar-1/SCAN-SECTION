<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cypherverse | 3D Interactive Card Viewer</title>
  <meta name="description"
    content="Cypherverse Card">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="spider.png">
  <link rel="apple-touch-icon" href="spider.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Background Music (Permanent Loop) -->
  <audio id="bgMusic" src="spiderman_nwh.mp3" loop preload="auto" playsinline></audio>

  <!-- Fullscreen Dynamic 4K Wallpaper Background System -->
  <div class="wallpaper-container" id="wallpaperContainer">
    <div class="wallpaper-layer active" id="wallpaperLayerA"></div>
    <div class="wallpaper-layer" id="wallpaperLayerB"></div>
    <div class="wallpaper-vignette"></div>
  </div>

  <!-- Fullscreen Interactive Canvas for Web Particle Network -->
  <canvas id="webCanvas"></canvas>

  <!-- Comic Halftone Background Overlay -->
  <div class="comic-overlay"></div>

  <!-- Corner Spider Web SVG Decorations -->
  <div class="web-corner top-left">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor">
      <path d="M0,0 L100,0 M0,0 L0,100 M0,100 L100,100" stroke-width="1" />
      <path d="M0,25 Q25,25 25,0" stroke-width="0.75" />
      <path d="M0,50 Q50,50 50,0" stroke-width="0.75" />
      <path d="M0,75 Q75,75 75,0" stroke-width="0.75" />
      <path d="M0,100 Q100,100 100,0" stroke-width="0.75" />
    </svg>
  </div>
  <div class="web-corner top-right">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor">
      <path d="M100,0 L0,0 M100,0 L100,100 M100,0 L100,100" stroke-width="1" />
      <path d="M100,25 Q75,25 75,0" stroke-width="0.75" />
      <path d="M100,50 Q50,50 50,0" stroke-width="0.75" />
      <path d="M100,75 Q25,75 25,0" stroke-width="0.75" />
      <path d="M100,100 Q0,100 0,0" stroke-width="0.75" />
    </svg>
  </div>

  <!-- Cypherverse Header -->
  <header class="navbar">
    <div class="logo-container">
      <img src="spider.png" alt="Cypherverse Spider Logo" class="spider-logo-img" />
      <span class="logo-text">CYPHER<span class="highlight-red">VERSE</span></span>
    </div>
  </header>

  <!-- Main Central Card Stage: Single Card Only -->
  <main class="card-stage">

    <!-- 3D Card Perspective Wrapper -->
    <div class="card-container" id="cardContainer" tabindex="0" role="button"
      aria-label="Cypherverse Dossier Card. Click to flip.">
      <div class="flip-card" id="flipCard">

        <!-- Card Front Face -->
        <div class="card-face card-front">
          <div class="card-glass-shine"></div>
          <img id="frontImg" alt="Cypherverse Dossier Front" class="card-img" />
          <div class="card-border-glow"></div>
        </div>

        <!-- Card Back Face -->
        <div class="card-face card-back">
          <div class="card-glass-shine"></div>
          <img id="backImg" alt="Cypherverse Dossier Back" class="card-img" />
          <div class="card-border-glow"></div>
        </div>

      </div>
    </div>

    <!-- Blinking Interactive Tap Prompt -->
    <div class="tap-hint" id="tapHint" role="button" tabindex="0" aria-label="Tap to flip card">
      <div class="tap-hint-pill">
        <svg class="tap-hand-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74 0-2.49-2.01-4.5-4.5-4.5S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.09-.35-.14-.54-.14H13v-6c0-.55-.45-1-1-1s-1 .45-1 1v10.74l-3.44-.72c-.09-.02-.18-.03-.27-.03-.38 0-.73.16-.98.42l-.84.85 4.97 4.97c.56.56 1.33.87 2.12.87h6.63c1.47 0 2.68-1.07 2.87-2.53l.68-5.06c.06-.45-.08-.9-.37-1.23-.29-.33-.7-.52-1.14-.52z"/>
        </svg>
        <span class="tap-hint-pulse-dot"></span>
        <span class="tap-hint-text">TAP ON CARD</span>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>

</html>
