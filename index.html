<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider-Verse Dossier Card | 3D Viewer</title>
  <meta name="description" content="Ultra-minimalist 3D interactive Spider-Verse flip card featuring front and back hero dossier views.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fullscreen Interactive Canvas for Web Particle Network -->
  <canvas id="webCanvas"></canvas>
  
  <!-- Comic Halftone Background Overlay -->
  <div class="comic-overlay"></div>

  <!-- Main Central Card Stage: Single Card Only -->
  <main class="card-stage">
    
    <!-- 3D Card Perspective Wrapper -->
    <div class="card-container" id="cardContainer" tabindex="0" role="button" aria-label="Spider-Man Dossier Card. Click to flip.">
      <div class="flip-card" id="flipCard">
        
        <!-- Card Front Face -->
        <div class="card-face card-front">
          <div class="card-glass-shine"></div>
          <img src="front_image.png" id="frontImg" alt="Spider-Man Dossier Front" class="card-img" />
          <div class="card-border-glow"></div>
        </div>

        <!-- Card Back Face -->
        <div class="card-face card-back">
          <div class="card-glass-shine"></div>
          <img src="back_image.png" id="backImg" alt="Spider-Man Dossier Back" class="card-img" />
          <div class="card-border-glow"></div>
        </div>

      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
