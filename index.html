<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider-Verse Dossier Vault | Split 3D Card Collection</title>
  <meta name="description" content="Minimalist 3D interactive Spider-Verse flip card collection displayed side-by-side in a split layout featuring front and back hero dossier views.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fullscreen Interactive Canvas for Web Particle Network -->
  <canvas id="webCanvas"></canvas>
  
  <!-- Comic Halftone Background Overlay -->
  <div class="comic-overlay"></div>

  <!-- Corner Spider Web SVG Decorations -->
  <div class="web-corner top-left">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor">
      <path d="M0,0 L100,0 M0,0 L0,100 M0,0 L100,100" stroke-width="1"/>
      <path d="M0,25 Q25,25 25,0" stroke-width="0.75"/>
      <path d="M0,50 Q50,50 50,0" stroke-width="0.75"/>
      <path d="M0,75 Q75,75 75,0" stroke-width="0.75"/>
      <path d="M0,100 Q100,100 100,0" stroke-width="0.75"/>
    </svg>
  </div>
  <div class="web-corner top-right">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor">
      <path d="M100,0 L0,0 M100,0 L100,100 M100,0 L0,100" stroke-width="1"/>
      <path d="M100,25 Q75,25 75,0" stroke-width="0.75"/>
      <path d="M100,50 Q50,50 50,0" stroke-width="0.75"/>
      <path d="M100,75 Q25,75 25,0" stroke-width="0.75"/>
      <path d="M100,100 Q0,100 0,0" stroke-width="0.75"/>
    </svg>
  </div>

  <!-- Minimal Navigation Bar -->
  <header class="navbar">
    <div class="logo-container">
      <div class="spider-logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L14.5 7H18L15 10.5L16.5 15L12 12.5L7.5 15L9 10.5L6 7H9.5L12 2Z"/>
          <path d="M12 2C10.5 5 7 8 3 7C2 10 4 14 7 15C5 17 3 21 2 22C6 21 9 18 10.5 16C11.5 17.5 12.5 17.5 13.5 16C15 18 18 21 22 22C21 21 19 17 17 15C20 14 22 10 21 7C17 8 13.5 5 12 2Z"/>
        </svg>
      </div>
      <span class="logo-text">SPIDER<span class="highlight-blue">-DOSSIER</span></span>
    </div>

    <div class="header-actions">
      <button id="flipAllBtn" class="action-btn mode-btn" title="Flip All Cards Simultaneously">
        <span class="btn-text">🔄 FLIP ALL CARDS</span>
      </button>
      <button id="soundToggleBtn" class="action-btn icon-btn" title="Toggle Web Sound Effects">
        <span class="sound-icon">🔊</span>
        <span class="btn-text">THWIP FX: ON</span>
      </button>
    </div>
  </header>

  <!-- Main Central Card Stage: Split View -->
  <main class="card-stage">
    
    <!-- Status Header -->
    <div class="status-badge" id="cardStatusBadge">
      <span class="pulse-dot"></span>
      <span class="status-text">CLICK ANY CARD TO FLIP (SIDE A ↔ SIDE B)</span>
    </div>

    <!-- Split Grid of Cards -->
    <div class="cards-split-grid" id="cardsGrid">
      
      <!-- Card 1 -->
      <div class="spider-card" data-id="1" tabindex="0" role="button" aria-label="Spider Dossier Card 1. Click to flip.">
        <div class="card-tag">CARD 01</div>
        <div class="flip-card" id="flipCard-1">
          <div class="card-face card-front">
            <div class="card-glass-shine"></div>
            <img src="front_image.png" alt="Card 01 Front" class="card-img" />
            <div class="card-border-glow"></div>
          </div>
          <div class="card-face card-back">
            <div class="card-glass-shine"></div>
            <img src="back_image.png" alt="Card 01 Back" class="card-img" />
            <div class="card-border-glow"></div>
          </div>
        </div>
        <div class="card-side-label">SIDE A (FRONT)</div>
      </div>

      <!-- Card 2 -->
      <div class="spider-card" data-id="2" tabindex="0" role="button" aria-label="Spider Dossier Card 2. Click to flip.">
        <div class="card-tag">CARD 02</div>
        <div class="flip-card" id="flipCard-2">
          <div class="card-face card-front">
            <div class="card-glass-shine"></div>
            <img src="front 2.png" alt="Card 02 Front" class="card-img" />
            <div class="card-border-glow"></div>
          </div>
          <div class="card-face card-back">
            <div class="card-glass-shine"></div>
            <img src="back 2.png" alt="Card 02 Back" class="card-img" />
            <div class="card-border-glow"></div>
          </div>
        </div>
        <div class="card-side-label">SIDE A (FRONT)</div>
      </div>

      <!-- Card 3 -->
      <div class="spider-card" data-id="3" tabindex="0" role="button" aria-label="Spider Dossier Card 3. Click to flip.">
        <div class="card-tag">CARD 03</div>
        <div class="flip-card" id="flipCard-3">
          <div class="card-face card-front">
            <div class="card-glass-shine"></div>
            <img src="front 3.png" alt="Card 03 Front" class="card-img" />
            <div class="card-border-glow"></div>
          </div>
          <div class="card-face card-back">
            <div class="card-glass-shine"></div>
            <img src="back 3.png" alt="Card 03 Back" class="card-img" />
            <div class="card-border-glow"></div>
          </div>
        </div>
        <div class="card-side-label">SIDE A (FRONT)</div>
      </div>

      <!-- Card 4 -->
      <div class="spider-card" data-id="4" tabindex="0" role="button" aria-label="Spider Dossier Card 4. Click to flip.">
        <div class="card-tag">CARD 04</div>
        <div class="flip-card" id="flipCard-4">
          <div class="card-face card-front">
            <div class="card-glass-shine"></div>
            <img src="front 4.png" alt="Card 04 Front" class="card-img" />
            <div class="card-border-glow"></div>
          </div>
          <div class="card-face card-back">
            <div class="card-glass-shine"></div>
            <img src="back 4.png" alt="Card 04 Back" class="card-img" />
            <div class="card-border-glow"></div>
          </div>
        </div>
        <div class="card-side-label">SIDE A (FRONT)</div>
      </div>

    </div>

  </main>

  <!-- Minimal Footer -->
  <footer class="minimal-footer">
    <span>WITH GREAT POWER COMES GREAT RESPONSIBILITY • SPIDER-VERSE DOSSIER VAULT</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
